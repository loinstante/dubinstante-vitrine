<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="icon" type="image/png" href="/assets/DubInstante.png" />
    <link rel="apple-touch-icon" href="/assets/DubInstante.png" />

    <!-- Page-specific tags. This block is only the dev-server default: the build replaces
         it for every page and language (scripts/prerender.mjs, texts in src/seo.ts). -->
    <!--seo:start-->
    <title>DubInstante — Logiciel libre de bande rythmo et doublage</title>
    <meta
      name="description"
      content="Logiciel gratuit et open source de doublage vidéo : bande rythmo défilante, enregistrement jusqu'à 4 micros, export FFmpeg. Windows et Linux, hors-ligne."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dubinstante.vercel.app/" />
    <meta property="og:title" content="DubInstante — Logiciel libre de bande rythmo et doublage" />
    <meta property="og:description" content="Logiciel gratuit et open source de doublage vidéo." />
    <meta property="og:image" content="https://dubinstante.vercel.app/assets/dubinstante-studio-real.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DubInstante — Logiciel libre de bande rythmo et doublage" />
    <meta name="twitter:description" content="Logiciel gratuit et open source de doublage vidéo." />
    <meta name="twitter:image" content="https://dubinstante.vercel.app/assets/dubinstante-studio-real.png" />
    <!--seo:end-->


    <!-- Immediate theme initialization to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dubinstante_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Scroll-reveal starts hidden and is shown by JavaScript: keep the content visible without it -->
    <noscript>
      <style>
        [data-reveal] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
